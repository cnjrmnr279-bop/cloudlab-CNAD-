<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sample Webpage</title>
</head>
<body>

  <!-- Main Heading -->
  <h1>Welcome to My Webpage</h1>
  <p>This is a paragraph with <strong>bold text</strong> and <em>italicized text</em>.</p>

  <!-- Hyperlink -->
  <h2>Useful Links</h2>
  <p>Learn more about web standards on <a href="https://developer.mozilla.org/" target="_blank">MDN Web Docs</a>.</p>

  <!-- Unordered List -->
  <h2>Key HTML Elements</h2>
  <ul>
    <li>Headings and paragraphs for text</li>
    <li>Anchor tags for navigation links</li>
    <li>Images and lists for structured content</li>
  </ul>

  <!-- Image -->
  <h2>Sample Image</h2>
  <img src="https://placeholder.com" alt="A 300 by 150 placeholder graphic" width="300" height="150">

</body>
</html>
